<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick your cue</title>
<meta name="description" content="Choose a cue and build a saved prompt for a task that keeps getting stuck.">
<style>
:root {
  --bg: #faf7f2;
  --surface: #ffffff;
  --surface-2: #f2eee7;
  --text: #1f2328;
  --text-muted: #4a525b;
  --border: #757d86;
  --border-soft: #d9d3c9;
  --accent: #0b6560;
  --accent-tint: #e3f1ef;
  --on-accent: #ffffff;
  --focus: #1a56b0;
  --error: #a3221a;
  --error-tint: #fbeceb;
  --ok: #1d6b34;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181c;
    --surface: #1e2227;
    --surface-2: #262b31;
    --text: #eceff1;
    --text-muted: #bcc3ca;
    --border: #8c959e;
    --border-soft: #3a4048;
    --accent: #5cc6be;
    --accent-tint: #1b3533;
    --on-accent: #0a1d1c;
    --focus: #8ab4f8;
    --error: #ff9e94;
    --error-tint: #3a1f1d;
    --ok: #86d69b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15181c; --surface: #1e2227; --surface-2: #262b31; --text: #eceff1;
  --text-muted: #bcc3ca; --border: #8c959e; --border-soft: #3a4048; --accent: #5cc6be;
  --accent-tint: #1b3533; --on-accent: #0a1d1c; --focus: #8ab4f8; --error: #ff9e94;
  --error-tint: #3a1f1d; --ok: #86d69b; color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 1.0625rem;
  line-height: 1.55;
}
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5rem; }
h1 { font-size: 1.75rem; }
h2 { font-size: 1.2rem; }
p { margin: 0 0 1rem; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[tabindex="-1"]:focus { outline: none; }
[hidden] { display: none !important; }

.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip {
  position: absolute; left: 1rem; top: -100px; background: var(--surface); color: var(--text);
  padding: .5rem 1rem; border: 2px solid var(--focus); border-radius: var(--radius); z-index: 10;
}
.skip:focus { top: 1rem; }

/* Header */
.site-header {
  display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1.25rem;
  padding: .75rem 1rem; border-bottom: 1px solid var(--border-soft); background: var(--surface);
}
.brand { font-weight: 700; margin-right: auto; }
.progress { display: flex; align-items: center; gap: .75rem; }
.progress-text { font-weight: 600; white-space: nowrap; }
.bar { display: flex; gap: 4px; }
.bar span { width: 18px; height: 8px; border-radius: 4px; border: 1px solid var(--border); background: transparent; }
.bar span.done { background: var(--accent); border-color: var(--accent); }
.header-actions { display: flex; gap: .25rem; }
.quiet {
  font: inherit; font-size: .95rem; color: var(--text); background: transparent;
  border: 1px solid transparent; border-radius: 6px; padding: .35rem .6rem; min-height: 36px;
  text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
}
.quiet:hover { background: var(--surface-2); border-color: var(--border-soft); }

/* Layout */
main { max-width: 1120px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
.screen-grid { display: grid; gap: 1.25rem; grid-template-columns: minmax(0, 1fr); }
.narrow { max-width: 680px; }
@media (min-width: 900px) {
  .screen-grid.with-preview {
    grid-template-columns: minmax(0, 1fr) minmax(0, 400px);
    grid-template-areas: "head preview" "form preview";
    align-items: start; column-gap: 2rem;
  }
  .with-preview .screen-head { grid-area: head; }
  .with-preview .preview { grid-area: preview; }
  .with-preview .screen-form { grid-area: form; }
}
@media (min-width: 900px) and (min-height: 640px) {
  .with-preview .preview { position: sticky; top: 1rem; }
}

.lead { font-size: 1.1rem; }
.muted { color: var(--text-muted); }

/* Preview */
.preview { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); }
.preview summary {
  cursor: pointer; padding: .75rem 1rem; font-weight: 700; list-style-position: inside; min-height: 44px;
}
.preview-body { padding: 0 1rem 1rem; }
.pv-h { font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin: .75rem 0 .35rem; }
.pv-cue, .pv-prompt p { margin: 0 0 .5rem; padding: .15rem .5rem; border-left: 3px solid transparent; }
.pv-cue.current, .pv-prompt p.current { border-left-color: var(--accent); background: var(--accent-tint); }
.blank { letter-spacing: .05em; color: var(--text-muted); }
.change-text { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; font-weight: 600; }
.change-label { font-weight: 700; font-size: .85em; text-transform: uppercase; letter-spacing: .03em; }

/* Choices */
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.choices { display: grid; gap: .6rem; }
.option {
  display: flex; align-items: flex-start; gap: .75rem; padding: .75rem 1rem; min-height: 48px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer;
}
.option:hover { background: var(--surface-2); }
.option:has(input:checked) { border: 2px solid var(--accent); background: var(--accent-tint); padding: calc(.75rem - 1px) calc(1rem - 1px); }
.option input { width: 1.25rem; height: 1.25rem; margin: .15rem 0 0; flex: none; accent-color: var(--accent); }
.subgroup { display: grid; gap: .5rem; margin-top: .5rem; }
.group-label { font-weight: 700; padding: 0; margin-bottom: .25rem; }
.or-label { font-weight: 700; margin: .75rem 0 0; }
.custom { padding: 1rem; margin-top: -.1rem; background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); }
.custom label { display: block; font-weight: 700; margin-bottom: .25rem; }
.hint { color: var(--text-muted); margin: 0 0 .5rem; }
.privacy { font-size: .95rem; color: var(--text-muted); margin: .5rem 0 0; }
input[type="text"], textarea {
  font: inherit; color: var(--text); background: var(--bg); width: 100%;
  border: 1px solid var(--border); border-radius: 8px; padding: .6rem .75rem; min-height: 44px;
}
textarea { line-height: 1.5; resize: vertical; }

.badge {
  display: inline-block; font-size: .85rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
  border: 2px solid var(--accent); color: var(--text); border-radius: 999px; padding: .1rem .7rem; margin-bottom: .6rem;
}
h1 .badge { display: table; }

/* Cue check */
.cue-check { margin-top: 1.5rem; padding: 1rem; background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); }
.yesno { margin-bottom: 1rem; }
.yesno legend { font-weight: 600; margin-bottom: .4rem; padding: 0; }
.yesno-opts { display: flex; gap: .5rem; flex-wrap: wrap; }
.yesno .option { min-width: 7rem; }
.check-result p { margin-bottom: .75rem; }
.check-ok { font-weight: 600; }

/* Messages */
.error {
  color: var(--error); background: var(--error-tint); border-left: 4px solid var(--error);
  padding: .6rem .85rem; border-radius: 6px; font-weight: 600; margin: 1rem 0 0;
}

/* Buttons */
.nav { display: flex; justify-content: space-between; gap: .75rem; margin-top: 1.5rem; flex-wrap: wrap; }
.btn {
  font: inherit; font-weight: 600; border-radius: 8px; padding: .65rem 1.25rem; min-height: 44px; cursor: pointer;
  border: 2px solid var(--accent);
}
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.secondary { background: var(--surface); color: var(--text); border-color: var(--border); }
.btn.secondary:hover { background: var(--surface-2); }
.btn-row { display: flex; gap: .6rem; flex-wrap: wrap; margin: .75rem 0 .25rem; }
.linkbtn {
  font: inherit; background: none; border: 0; padding: .35rem 0; min-height: 32px; color: var(--accent);
  text-decoration: underline; text-underline-offset: 3px; cursor: pointer; text-align: left;
}
.status { min-height: 1.5em; color: var(--ok); font-weight: 600; margin: .25rem 0 .5rem; }

/* Result */
.result section { margin-top: 2rem; }
.cue-card {
  background: var(--surface); border: 2px solid var(--accent); border-radius: 14px; padding: 1.25rem 1.5rem;
  font-size: 1.25rem; font-weight: 600; line-height: 1.45;
}
.cue-card p { margin: 0; }
.keep { margin-top: .75rem; }
.edit-links { list-style: none; padding: 0; margin: 0; display: grid; gap: .25rem; }
.checklist { list-style: none; padding: 0; margin: 0; display: grid; gap: .4rem; }
.checklist li { display: flex; gap: .6rem; align-items: baseline; }
.checklist .tick { color: var(--accent); font-weight: 700; }

/* Dialogs */
dialog {
  color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 1.5rem; max-width: min(480px, calc(100vw - 2rem)); width: 100%;
}
dialog::backdrop { background: rgba(0, 0, 0, .55); }
dialog .actions { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1.25rem; }

#printArea { display: none; }

@media print {
  body { background: #fff; color: #000; }
  .site-header, .nav, .btn-row, .status, .skip, .edit-section, .another-section, .preview { display: none !important; }
  body.print-card > *:not(#printArea) { display: none !important; }
  body.print-card #printArea { display: block; }
  #printArea .card {
    border: 2px solid #000; border-radius: 12px; padding: 18pt 22pt; max-width: 5.5in;
    font: 600 18pt/1.4 system-ui, Arial, sans-serif; color: #000; background: #fff;
  }
  #printArea .card-label { font: 700 10pt/1 system-ui, Arial, sans-serif; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10pt; }
  .cue-card { border-color: #000; }
  textarea { border: 1px solid #000; }
}

@media (prefers-reduced-motion: no-preference) {
  .option, .btn, .quiet { transition: background-color .15s ease, border-color .15s ease; }
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>

<header class="site-header">
  <div class="brand">Pick your cue</div>
  <div class="progress" id="progress" hidden>
    <span class="progress-text" id="stepText"></span>
    <span class="bar" id="bar" aria-hidden="true"></span>
  </div>
  <div class="header-actions" id="headerActions" hidden>
    <button type="button" class="quiet" id="breakBtn">Take a break</button>
    <button type="button" class="quiet" id="restartBtn">Start over</button>
  </div>
</header>

<main id="main" tabindex="-1">
  <div id="screen"></div>
</main>

<div id="printArea" aria-hidden="true"></div>
<div id="announcer" class="sr-only" role="status" aria-live="polite"></div>

<dialog id="breakDialog" aria-labelledby="breakTitle" aria-describedby="breakBody">
  <h2 id="breakTitle">Take a break</h2>
  <div id="breakBody"></div>
  <div class="actions" id="breakActions"></div>
  <p class="status" id="breakStatus" role="status"></p>
</dialog>

<dialog id="restartDialog" aria-labelledby="restartTitle" aria-describedby="restartBody">
  <h2 id="restartTitle">Start over?</h2>
  <div id="restartBody">
    <p>This clears all your answers and takes you back to the first step.</p>
    <p id="restartExtra" hidden>If you want to keep this cue and prompt, copy or download them first.</p>
  </div>
  <div class="actions">
    <button type="button" class="btn primary" id="keepBtn" autofocus>Keep my answers</button>
    <button type="button" class="btn secondary" id="clearBtn">Clear and start over</button>
  </div>
</dialog>

<script>
(function () {
  'use strict';

  /* ---------- Content ---------- */

  var TASKS = [
    {
      id: 'study',
      label: 'Studying for an exam or certification at a set time each week',
      opening: "I'm studying for an exam or certification, and I study at a set time each week.",
      goalLine: 'Tonight I want to finish {goal}.',
      dont: 'answer the questions for me',
      stuck: [
        'I open the practice questions and start rereading my notes instead',
        'I sit down and spend the time reorganizing my study materials',
        "I can't decide which topic to start with"
      ],
      cues: {
        doing: 'I open my notes and start rereading them',
        telling: 'I think, "I\'ll review a bit more first"',
        place: 'I sit down at my desk at study time'
      },
      goalHeading: 'What do you want to finish next session?',
      goals: [
        "10 practice questions on this week's topic",
        'the review questions for one chapter',
        "a 20-minute review of last week's notes"
      ],
      tried: ['starting with the hardest questions', 'blocking out the whole evening', 'making a detailed study schedule']
    },
    {
      id: 'dinner',
      label: 'Making dinner on weeknights instead of ordering takeout',
      opening: 'I want to make dinner at home tonight instead of ordering takeout.',
      goalLine: 'I have {goal} and about 30 minutes.',
      dont: 'give me a meal plan',
      stuck: [
        "I open the fridge and can't decide what to make",
        'I get home tired and pick up my phone to order',
        'I start looking up recipes and never pick one'
      ],
      cues: {
        doing: 'I open the fridge and close it again',
        telling: 'I think, "I\'ll figure out food later"',
        place: 'I walk in the door after work'
      },
      goalHeading: 'What do you have to work with tonight?',
      goals: ['eggs, rice, and some vegetables', 'pasta and a jar of sauce', 'leftover chicken and tortillas'],
      tried: ['planning meals for the whole week', 'buying groceries for specific recipes', 'keeping a list of easy meals on the fridge']
    },
    {
      id: 'project',
      label: 'Getting started on a difficult project at work',
      opening: "I'm working on a difficult project at work.",
      goalLine: 'Today I want to finish {goal}.',
      dont: 'give me a project plan',
      stuck: [
        "I open the project files and don't know which part to tackle first",
        'I sit down to work on it and start answering email instead',
        'I keep rereading the project brief without starting'
      ],
      cues: {
        doing: 'I open the project folder and close it again',
        telling: 'I think, "I need more information before I start"',
        place: 'I sit down at my desk after my morning meeting'
      },
      goalHeading: "What's one small piece you could finish today?",
      goals: ['a rough outline', 'the first section', 'a list of questions to ask my manager'],
      tried: ['blocking out a whole afternoon', 'starting with the hardest part', 'making a detailed to-do list']
    }
  ];

  var CUSTOM = {
    id: 'custom',
    goalLine: 'Today I want to finish {goal}.',
    dont: 'give me a to-do list',
    stuck: ['I get set up to start and then walk away', 'I start something else instead', "I can't decide where to begin"],
    cues: {
      doing: 'I pick up my phone instead of starting',
      telling: 'I think, "I\'ll do this later"',
      place: 'I sit down at the place I usually do this task'
    },
    goalHeading: "What's one small goal for next time?",
    goals: ['the first 10 minutes of it', 'one small piece of it', 'the very first step'],
    tried: ['setting a reminder', 'blocking out a lot of time', 'making a detailed list']
  };

  var CUE_GROUPS = [
    { key: 'doing', label: 'Something you do' },
    { key: 'telling', label: 'Something you tell yourself' },
    { key: 'place', label: 'A time or place' }
  ];

  var PRIVACY = 'Leave out names, account numbers, and other private details. The chatbot only needs enough to understand the task.';
  var TOTAL = 6;
  var KEY = 'pickYourCue.v1';
  var PREF_KEY = 'pickYourCue.previewOpen';
  var MAX_AGE = 30 * 24 * 60 * 60 * 1000;

  /* ---------- Storage ---------- */

  var storageOK = (function () {
    try { var k = '__pyc_test'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; }
    catch (e) { return false; }
  })();

  function freshState() {
    return {
      step: 1, task: null, taskCustom: '',
      stuck: null, stuckCustom: '',
      cue: null, cueCustom: '', check1: null, check2: null,
      goal: null, goalCustom: '',
      tried: [], triedNothing: false, triedOwn: false, triedCustom: '',
      promptEdited: null, editing: false
    };
  }

  function save() {
    if (!storageOK) return;
    try { localStorage.setItem(KEY, JSON.stringify({ v: 1, savedAt: Date.now(), state: state })); } catch (e) {}
  }
  function clearSaved() { try { localStorage.removeItem(KEY); } catch (e) {} }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return null;
      var d = JSON.parse(raw);
      if (!d || d.v !== 1 || !d.state) return null;
      if (Date.now() - d.savedAt > MAX_AGE) { clearSaved(); return null; }
      var s = Object.assign(freshState(), d.state);
      if (s.task !== null && s.task !== 'custom' && !findTask(s.task)) return null;
      if (!Array.isArray(s.tried)) s.tried = [];
      s.step = Math.min(Math.max(parseInt(s.step, 10) || 1, 1), TOTAL);
      return s;
    } catch (e) { return null; }
  }
  function getPref() { try { return localStorage.getItem(PREF_KEY) !== 'closed'; } catch (e) { return true; } }
  function setPref(open) { try { localStorage.setItem(PREF_KEY, open ? 'open' : 'closed'); } catch (e) {} }

  /* ---------- Helpers ---------- */

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function findTask(id) { for (var i = 0; i < TASKS.length; i++) if (TASKS[i].id === id) return TASKS[i]; return null; }
  function taskObj() { return state.task === 'custom' ? CUSTOM : findTask(state.task); }
  function optionSet() { return taskObj() || CUSTOM; }

  function lowerFirst(s) {
    if (/^I\b/.test(s)) return s;
    var word = s.split(/\s/)[0];
    if (word.length > 1 && word === word.toUpperCase() && /[A-Z]/.test(word)) return s;
    return s.charAt(0).toLowerCase() + s.slice(1);
  }
  function tidy(s, prefix) {
    s = String(s || '').replace(/\s+/g, ' ').trim();
    if (prefix) s = s.replace(prefix, '');
    s = s.replace(/[\s.,;:!]+$/, '').replace(/[\s.,;:!]+(["”])$/, '$1').trim();
    if (!s) return '';
    return lowerFirst(s);
  }
  function joinList(a) {
    if (a.length <= 1) return a.join('');
    if (a.length === 2) return a[0] + ' and ' + a[1];
    return a.slice(0, -1).join(', ') + ', and ' + a[a.length - 1];
  }

  /* ---------- Answers ---------- */

  function taskText() { return state.task === 'custom' ? tidy(state.taskCustom, /^i'?m working on\s+/i) : ''; }
  function stuckText() {
    if (state.stuck === null) return '';
    if (state.stuck === 'custom') return tidy(state.stuckCustom, /^i get stuck when\s+/i);
    return optionSet().stuck[state.stuck] || '';
  }
  function cueText() {
    if (state.cue === null) return '';
    if (state.cue === 'custom') return tidy(state.cueCustom, /^when\s+/i);
    return optionSet().cues[state.cue] || '';
  }
  function goalText() {
    if (state.goal === null) return '';
    if (state.goal === 'custom') return tidy(state.goalCustom);
    return optionSet().goals[state.goal] || '';
  }
  function triedItems() {
    var t = optionSet();
    var list = state.tried.slice().sort().map(function (i) { return t.tried[i]; }).filter(Boolean);
    var own = tidy(state.triedCustom, /^i(?:'ve| have)\s+(?:already\s+)?tried\s+/i);
    if (state.triedOwn && own) list.push(own);
    return list;
  }

  function isComplete(step) {
    switch (step) {
      case 1: return state.task !== null && (state.task !== 'custom' || !!taskText());
      case 2: return state.stuck !== null && (state.stuck !== 'custom' || !!stuckText());
      case 3: return state.cue !== null && (state.cue !== 'custom' || !!cueText()) && state.check1 !== null && state.check2 !== null;
      case 4: return state.goal !== null && (state.goal !== 'custom' || !!goalText());
      case 5:
        if (state.triedOwn && !tidy(state.triedCustom)) return false;
        return state.triedNothing || state.tried.length > 0 || (state.triedOwn && !!tidy(state.triedCustom));
      default: return true;
    }
  }
  function firstIncomplete() { for (var s = 1; s <= 5; s++) if (!isComplete(s)) return s; return null; }
  function hasAnswers(s) { return s && s.task !== null; }

  /* ---------- Building the cue sentence and prompt ---------- */

  var BLANK_HTML = '<span class="blank">___<span class="sr-only"> (blank)</span></span>';

  function cueSentence(mode) {
    var cue = cueText();
    var tail = " I'll open a chatbot and paste my saved prompt.";
    if (!cue) return 'When ' + (mode === 'html' ? BLANK_HTML : '___') + ',' + tail;
    var body;
    if (/["”]$/.test(cue)) body = cue.slice(0, -1) + ',' + cue.slice(-1);
    else body = cue + ',';
    return 'When ' + (mode === 'html' ? esc(body) : body) + tail;
  }

  function promptLines(mode) {
    var html = mode === 'html';
    function fill(v) { return v ? (html ? esc(v) : v) : (html ? BLANK_HTML : '___'); }
    var t = taskObj();
    var opening;
    if (!t) opening = "I'm working on " + fill('') + '.';
    else if (t.id === 'custom') opening = "I'm working on " + fill(taskText()) + '.';
    else opening = html ? esc(t.opening) : t.opening;

    var tpl = (t || CUSTOM).goalLine.split('{goal}');
    var g = goalText();
    var goalPart = html
      ? '<span class="change"><span class="change-text">' + fill(g) + '</span> <span class="change-label">(Change each time)</span></span>'
      : '[CHANGE EACH TIME: ' + (g || '___') + ']';
    var line1 = opening + ' ' + (html ? esc(tpl[0]) : tpl[0]) + goalPart + (html ? esc(tpl[1]) : tpl[1]);
    var line2 = 'I get stuck when ' + fill(stuckText()) + '.';
    var line3 = state.triedNothing ? null : "I've already tried " + fill(joinList(triedItems())) + '.';
    var line4 = 'Give me two different ways to start that take 10 minutes or less. Don\'t ' +
      (t ? (html ? esc(t.dont) : t.dont) : fill('')) + ', and keep your reply short.';
    return [
      { key: 'opening', text: line1 },
      { key: 'stuck', text: line2 },
      { key: 'tried', text: line3 },
      { key: 'ask', text: line4 }
    ].filter(function (l) { return l.text !== null; });
  }

  function promptText() {
    if (state.promptEdited !== null) return state.promptEdited;
    return promptLines('text').map(function (l) { return l.text; }).join('\n');
  }

  /* ---------- Preview ---------- */

  var CURRENT_LINE = { 1: 'opening', 2: 'stuck', 3: 'cue', 4: 'opening', 5: 'tried' };

  function previewHTML() {
    var open = getPref() ? ' open' : '';
    return '<aside class="preview" aria-labelledby="previewTitle"><details id="previewDetails"' + open + '>' +
      '<summary><span id="previewTitle">My preview</span></summary>' +
      '<div class="preview-body" id="previewBody"></div></details></aside>';
  }

  function updatePreview() {
    var body = $('#previewBody');
    if (!body) return;
    var cur = CURRENT_LINE[state.step];
    var html = '<h2 class="pv-h">My cue sentence</h2>' +
      '<p class="pv-cue' + (cur === 'cue' ? ' current' : '') + '">' + cueSentence('html') + '</p>' +
      '<h2 class="pv-h">My saved prompt</h2><div class="pv-prompt">';
    promptLines('html').forEach(function (l) {
      html += '<p' + (cur === l.key ? ' class="current"' : '') + '>' + l.text + '</p>';
    });
    body.innerHTML = html + '</div>';
  }

  /* ---------- Announcements ---------- */

  var announceTimer;
  function announce(msg) {
    var el = $('#announcer');
    el.textContent = '';
    clearTimeout(announceTimer);
    announceTimer = setTimeout(function () { el.textContent = msg; }, 60);
  }

  /* ---------- Rendering ---------- */

  var state = freshState();
  var welcomeBack = false;
  var firstRender = true;

  function setHeader() {
    var inSteps = state.step >= 1 && state.step <= TOTAL && !onIntro;
    $('#progress').hidden = !inSteps;
    $('#headerActions').hidden = !inSteps;
    if (inSteps) {
      $('#stepText').textContent = 'Step ' + state.step + ' of ' + TOTAL;
      var bar = '';
      for (var i = 1; i <= TOTAL; i++) bar += '<span' + (i <= state.step ? ' class="done"' : '') + '></span>';
      $('#bar').innerHTML = bar;
    }
  }

  var onIntro = true;

  function focusHeading() {
    if (firstRender) { firstRender = false; return; }
    var h = $('#screenHeading');
    if (h) h.focus();
    window.scrollTo(0, 0);
  }

  function go(step) {
    if (step === 0) { onIntro = true; welcomeBack = false; render(); return; }
    onIntro = false;
    state.step = step;
    if (step === TOTAL) state.editing = false;
    save();
    render();
  }

  function render() {
    setHeader();
    var screen = $('#screen');
    var title;
    if (onIntro) {
      screen.innerHTML = welcomeBack ? welcomeHTML() : introHTML();
      title = welcomeBack ? 'Welcome back' : '';
      bindIntro();
    } else if (state.step === TOTAL) {
      screen.innerHTML = resultHTML();
      title = 'Step 6 of 6: My cue and saved prompt';
      bindResult();
    } else {
      var def = stepDef(state.step);
      screen.innerHTML = stepHTML(def);
      title = 'Step ' + state.step + ' of ' + TOTAL + ': ' + def.heading;
      bindStep(def);
      updatePreview();
      updateNextLabel();
    }
    document.title = title ? title + ' | Pick your cue' : 'Pick your cue';
    focusHeading();
  }

  /* ----- Intro ----- */

  function introHTML() {
    return '<div class="narrow">' +
      '<h1 id="screenHeading" tabindex="-1">Pick your cue</h1>' +
      '<p class="lead">A cue is a signal that tells you it\'s time to act. Here, it\'s your signal to ask an AI chatbot for a different way into a task that keeps getting stuck.</p>' +
      '<p class="lead">In about 10 minutes, you\'ll have two things: a cue sentence and a saved prompt.</p>' +
      '<div class="nav"><button type="button" class="btn primary" id="startBtn">Start</button></div></div>';
  }
  function welcomeHTML() {
    return '<div class="narrow">' +
      '<h1 id="screenHeading" tabindex="-1">Welcome back</h1>' +
      '<p class="lead">You stopped at Step ' + state.step + ' of ' + TOTAL + '. Your answers so far are still here.</p>' +
      '<div class="btn-row"><button type="button" class="btn primary" id="resumeBtn">Pick up where I left off</button>' +
      '<button type="button" class="btn secondary" id="freshBtn">Start over</button></div></div>';
  }
  function bindIntro() {
    var start = $('#startBtn');
    if (start) start.addEventListener('click', function () { go(state.step >= 1 && hasAnswers(state) ? state.step : 1); });
    var resume = $('#resumeBtn');
    if (resume) resume.addEventListener('click', function () { go(state.step); });
    var fresh = $('#freshBtn');
    if (fresh) fresh.addEventListener('click', function () { clearSaved(); state = freshState(); go(1); });
  }

  /* ----- Step definitions ----- */

  function stepDef(step) {
    var t = optionSet();
    switch (step) {
      case 1: return {
        step: 1, name: 'task', heading: 'What keeps getting stuck?',
        body: 'Choose one task that gets stuck in the same way, again and again.',
        options: TASKS.map(function (x) { return { value: x.id, label: x.label }; }),
        selected: state.task, customLabel: 'The task', customHint: 'For example, "cleaning the kitchen after dinner"',
        customKey: 'taskCustom',
        empty: 'Choose a task, or choose Type my own and describe it.',
        emptyCustom: 'Type your task, or choose one from the list.'
      };
      case 2: return {
        step: 2, name: 'stuck', heading: 'Where does it stop?',
        body: 'Think about the last time this task got stuck. What was happening when it stopped?',
        options: t.stuck.map(function (x, i) { return { value: String(i), label: x }; }),
        selected: state.stuck === null ? null : String(state.stuck), customLabel: 'The stuck moment',
        customHint: 'Describe the exact moment, such as "I open the file and stare at the first page."',
        customKey: 'stuckCustom',
        empty: 'Choose an option or type your own to keep going.',
        emptyCustom: 'Type your stuck moment, or choose an option from the list.'
      };
      case 3: return {
        step: 3, name: 'cue', heading: "What's your cue?",
        body: 'Your cue is something that happens right at the stuck moment. It can be something you do, something you tell yourself, or a time or place tied to the task. Pick one.',
        groups: CUE_GROUPS.map(function (g) { return { label: g.label, options: [{ value: g.key, label: t.cues[g.key] }] }; }),
        selected: state.cue, customLabel: 'Your cue',
        customHint: 'Finish the sentence "When ___," such as "I open my laptop and check email first."',
        customKey: 'cueCustom',
        empty: 'Choose a cue or type your own to keep going.',
        emptyCustom: 'Type your cue, or choose one from the list.'
      };
      case 4: return {
        step: 4, name: 'goal', heading: t.goalHeading, badge: true,
        body: "This is the only part of the prompt you'll update before you send it. Keep it small enough to finish in one sitting.",
        options: t.goals.map(function (x, i) { return { value: String(i), label: x }; }),
        selected: state.goal === null ? null : String(state.goal), customLabel: 'Your goal',
        customHint: 'One small, clear goal, such as "the first paragraph"',
        customKey: 'goalCustom',
        empty: 'Choose a goal or type your own to keep going.',
        emptyCustom: 'Type your goal, or choose one from the list.'
      };
      case 5: return {
        step: 5, name: 'tried', heading: 'What have you already tried?', multi: true,
        body: 'This tells the chatbot what to skip, so it suggests something new. Choose any that apply. If something you try later stops working, you can add it to this line.',
        options: t.tried.map(function (x, i) { return { value: String(i), label: x }; }),
        customLabel: 'What you tried', customHint: 'For example, "setting an alarm"',
        customKey: 'triedCustom',
        empty: 'Choose any that apply, or choose Nothing yet.',
        emptyCustom: 'Type what you tried, or uncheck Type my own.'
      };
    }
  }

  function optionHTML(type, name, value, label, checked) {
    return '<label class="option"><input type="' + type + '" name="' + name + '" value="' + esc(value) + '"' +
      (checked ? ' checked' : '') + '><span>' + esc(label) + '</span></label>';
  }

  function customHTML(def, show) {
    return '<div class="custom" id="customWrap"' + (show ? '' : ' hidden') + '>' +
      '<label for="customInput">' + esc(def.customLabel) + '</label>' +
      '<p class="hint" id="customHint">' + esc(def.customHint) + '</p>' +
      '<input type="text" id="customInput" autocomplete="off" aria-describedby="customHint privacyNote" value="' + esc(state[def.customKey]) + '">' +
      '<p class="privacy" id="privacyNote">' + esc(PRIVACY) + '</p></div>';
  }

  function stepHTML(def) {
    var head = '<div class="screen-head">' +
      '<h1 id="screenHeading" tabindex="-1">' + (def.badge ? '<span class="badge">Change each time<span class="sr-only">:</span></span> ' : '') + esc(def.heading) + '</h1>' +
      '<p class="lead">' + esc(def.body) + '</p></div>';

    // When the player typed their own task, put "Type my own" first on Steps 2 to 5.
    var ownFirst = state.task === 'custom' && def.step > 1;
    var ownOpen = def.multi ? state.triedOwn : def.selected === 'custom';
    var own = def.multi
      ? optionHTML('checkbox', 'tried', 'custom', 'Type my own', state.triedOwn)
      : optionHTML('radio', def.name, 'custom', 'Type my own', def.selected === 'custom');
    var ownBlock = (def.groups && !ownFirst ? '<div class="subgroup">' + own + '</div>' : own) + customHTML(def, ownOpen);

    var menu = '';
    if (def.multi) {
      def.options.forEach(function (o) {
        menu += optionHTML('checkbox', 'tried', o.value, o.label, state.tried.indexOf(Number(o.value)) !== -1);
      });
    } else if (def.groups) {
      def.groups.forEach(function (g) {
        menu += '<fieldset class="subgroup"><legend class="group-label">' + esc(g.label) + '</legend>';
        g.options.forEach(function (o) { menu += optionHTML('radio', def.name, o.value, o.label, def.selected === o.value); });
        menu += '</fieldset>';
      });
    } else {
      def.options.forEach(function (o) { menu += optionHTML('radio', def.name, o.value, o.label, def.selected === o.value); });
    }
    var nothing = def.multi ? optionHTML('checkbox', 'tried', 'nothing', 'Nothing yet', state.triedNothing) : '';

    var fields = '<fieldset class="choices" id="choiceGroup"><legend class="sr-only">' + esc(def.heading) + '</legend>';
    if (ownFirst) {
      fields += ownBlock + '<p class="or-label">Or start from one of these:</p>' + menu + nothing;
    } else {
      fields += menu + nothing + ownBlock;
    }
    fields += '</fieldset>';

    if (def.step === 3) fields += cueCheckHTML();

    var nav = '<p class="error" id="formError" hidden></p>' +
      '<div class="nav"><button type="button" class="btn secondary" id="backBtn">Back</button>' +
      '<button type="button" class="btn primary" id="nextBtn">Next</button></div>';

    return '<div class="screen-grid with-preview">' + head + previewHTML() +
      '<div class="screen-form" id="stepForm">' + fields + nav + '</div></div>';
  }

  function cueCheckHTML() {
    function yn(name, legend, val) {
      return '<fieldset class="yesno"><legend>' + legend + '</legend><div class="yesno-opts">' +
        optionHTML('radio', name, 'yes', 'Yes', val === 'yes') + optionHTML('radio', name, 'no', 'No', val === 'no') +
        '</div></fieldset>';
    }
    return '<section class="cue-check" id="cueCheck" aria-labelledby="checkTitle" hidden>' +
      '<h2 id="checkTitle">Check your cue</h2>' +
      yn('check1', '1. Does this happen right at the moment the task stops, not earlier?', state.check1) +
      yn('check2', '2. Will you notice it when it happens?', state.check2) +
      '<div class="check-result" id="checkResult"></div></section>';
  }

  /* ----- Step behavior ----- */

  function answersChanged() {
    state.promptEdited = null;
    clearError();
    updatePreview();
    updateNextLabel();
    save();
  }

  function setTask(v) {
    if (v === state.task) return;
    state.task = v;
    if (state.stuck !== 'custom') state.stuck = null;
    if (state.cue !== 'custom') { state.cue = null; state.check1 = null; state.check2 = null; }
    if (state.goal !== 'custom') state.goal = null;
    state.tried = [];
  }

  function bindStep(def) {
    var wrap = $('#customWrap');
    var input = $('#customInput');

    $('#previewDetails').addEventListener('toggle', function (e) { setPref(e.target.open); });
    $('#backBtn').addEventListener('click', function () { go(state.step - 1); });
    $('#nextBtn').addEventListener('click', function () { tryNext(def); });

    input.addEventListener('input', function () {
      state[def.customKey] = input.value;
      answersChanged();
      if (def.step === 3) updateCueCheck(false);
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); tryNext(def); }
    });

    if (def.multi) {
      $$('input[name="tried"]').forEach(function (box) {
        box.addEventListener('change', function () {
          var v = box.value;
          if (v === 'nothing') {
            state.triedNothing = box.checked;
            if (box.checked) {
              state.tried = []; state.triedOwn = false;
              $$('input[name="tried"]').forEach(function (b) { if (b !== box) b.checked = false; });
            }
          } else {
            if (box.checked) { state.triedNothing = false; $('input[name="tried"][value="nothing"]').checked = false; }
            if (v === 'custom') state.triedOwn = box.checked;
            else {
              var n = Number(v);
              state.tried = state.tried.filter(function (x) { return x !== n; });
              if (box.checked) state.tried.push(n);
            }
          }
          wrap.hidden = !state.triedOwn;
          answersChanged();
        });
      });
      return;
    }

    $$('input[name="' + def.name + '"]').forEach(function (r) {
      r.addEventListener('change', function () {
        var v = r.value;
        if (def.step === 1) setTask(v);
        else if (def.step === 3) {
          if (v !== state.cue) { state.check1 = null; state.check2 = null; $$('input[name="check1"], input[name="check2"]').forEach(function (c) { c.checked = false; }); }
          state.cue = v;
        } else {
          state[def.name] = v === 'custom' ? 'custom' : Number(v);
        }
        wrap.hidden = v !== 'custom';
        answersChanged();
        if (def.step === 3) updateCueCheck(false);
      });
    });

    if (def.step === 3) {
      $$('input[name="check1"], input[name="check2"]').forEach(function (r) {
        r.addEventListener('change', function () {
          state[r.name] = r.value;
          clearError();
          save();
          updateNextLabel();
          updateCueCheck(true);
        });
      });
      $('#checkResult').addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        if (b.id === 'differentCue') {
          state.cue = null; state.check1 = null; state.check2 = null;
          $$('input[name="cue"], input[name="check1"], input[name="check2"]').forEach(function (c) { c.checked = false; });
          wrap.hidden = true;
          answersChanged();
          updateCueCheck(false);
          $('input[name="cue"]').focus();
          announce('Choose a different cue.');
        } else if (b.id === 'keepCue') {
          goNext();
        }
      });
      updateCueCheck(false);
    }
  }

  function updateCueCheck(speak) {
    var box = $('#cueCheck');
    if (!box) return;
    var ready = state.cue !== null && (state.cue !== 'custom' || !!cueText());
    box.hidden = !ready;
    var res = $('#checkResult');
    if (!ready || state.check1 === null || state.check2 === null) { res.innerHTML = ''; return; }
    var html, msg;
    if (state.check1 === 'yes' && state.check2 === 'yes') {
      msg = 'That cue works. On to the next step.';
      html = '<p class="check-ok">' + msg + '</p>';
    } else {
      var tips = [];
      if (state.check1 === 'no') tips.push("Try a cue that's closer to the stuck moment. Waking up on a workout day happens hours before the stall. Putting on workout clothes and sitting back down happens right at it.");
      if (state.check2 === 'no') tips.push('Try something you do or see, like opening a file or an app. Actions and places can be easier to catch than thoughts.');
      msg = tips.join(' ');
      html = tips.map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('') +
        '<div class="btn-row"><button type="button" class="btn secondary" id="differentCue">Choose a different cue</button>' +
        '<button type="button" class="btn secondary" id="keepCue">Keep this one</button></div>';
    }
    res.innerHTML = html;
    if (speak) announce(msg);
  }

  function nextTarget() {
    if (state.editing) {
      var f = firstIncomplete();
      return f === null ? TOTAL : f;
    }
    return state.step + 1;
  }

  function updateNextLabel() {
    var btn = $('#nextBtn');
    if (!btn) return;
    var label = 'Next';
    if (state.step === 5) label = 'See my result';
    if (state.editing) {
      var othersDone = true;
      for (var s = 1; s <= 5; s++) if (s !== state.step && !isComplete(s)) othersDone = false;
      if (othersDone) label = 'Back to my result';
    }
    btn.textContent = label;
  }

  function goNext() { go(nextTarget()); }

  function clearError() {
    var err = $('#formError');
    if (!err || err.hidden) return;
    err.hidden = true; err.textContent = '';
    $$('[data-err]').forEach(function (el) {
      var ids = (el.getAttribute('aria-describedby') || '').split(' ').filter(function (x) { return x && x !== 'formError'; });
      if (ids.length) el.setAttribute('aria-describedby', ids.join(' ')); else el.removeAttribute('aria-describedby');
      el.removeAttribute('data-err');
      if (el.tagName === 'INPUT') el.removeAttribute('aria-invalid');
    });
  }

  function showError(msg, target, focusEl) {
    var err = $('#formError');
    err.textContent = msg;
    err.hidden = false;
    var ids = (target.getAttribute('aria-describedby') || '').split(' ').filter(Boolean);
    if (ids.indexOf('formError') === -1) ids.push('formError');
    target.setAttribute('aria-describedby', ids.join(' '));
    target.setAttribute('data-err', '1');
    if (target.tagName === 'INPUT') target.setAttribute('aria-invalid', 'true');
    (focusEl || target).focus();
  }

  function tryNext(def) {
    clearError();
    var group = $('#choiceGroup');
    var input = $('#customInput');
    var firstChoice = $('#choiceGroup input');
    if (def.step === 5) {
      if (state.triedOwn && !tidy(state.triedCustom)) return showError(def.emptyCustom, input);
      if (!isComplete(5)) return showError(def.empty, group, firstChoice);
      return goNext();
    }
    var sel = def.step === 1 ? state.task : state[def.name];
    if (sel === null) return showError(def.empty, group, firstChoice);
    if (sel === 'custom' && !tidy(state[def.customKey])) return showError(def.emptyCustom, input);
    if (def.step === 3 && (state.check1 === null || state.check2 === null)) {
      var name = state.check1 === null ? 'check1' : 'check2';
      var fs = $('input[name="' + name + '"]').closest('fieldset');
      return showError('Answer the two questions about your cue to keep going.', fs, $('input[name="' + name + '"]'));
    }
    goNext();
  }

  /* ----- Result ----- */

  function resultHTML() {
    var edits = [
      [1, 'Change the task'], [2, 'Change the stuck moment'], [3, 'Change the cue'],
      [4, 'Change the goal'], [5, "Change what you've tried"]
    ].map(function (e) { return '<li><button type="button" class="linkbtn" data-edit="' + e[0] + '">' + e[1] + '</button></li>'; }).join('');
    var checklist = [
      'One recurring stall', 'One cue that happens right at the stuck moment',
      'One cue sentence', 'One saved prompt, with the part that changes marked'
    ].map(function (c) { return '<li><span class="tick" aria-hidden="true">&#10003;</span><span>' + c + '</span></li>'; }).join('');

    return '<div class="narrow result">' +
      '<h1 id="screenHeading" tabindex="-1">My cue and saved prompt</h1>' +

      '<section aria-labelledby="cueTitle"><h2 id="cueTitle">My cue sentence</h2>' +
      '<div class="cue-card"><p id="cueSentence">' + esc(cueSentence('text')) + '</p></div>' +
      '<div class="btn-row"><button type="button" class="btn primary" id="copyCue">Copy cue sentence</button>' +
      '<button type="button" class="btn secondary" id="printCue">Print as a card</button></div>' +
      '<p class="status" id="cueStatus" role="status"></p>' +
      '<p class="keep"><strong>Where to keep it:</strong> Put it where your cue happens. For example, a sticky note on your laptop, or the first line of the note that holds your prompt.</p></section>' +

      '<section aria-labelledby="promptTitle"><h2 id="promptTitle">My saved prompt</h2>' +
      '<p class="hint" id="promptHint">You can edit the prompt here. The part marked [CHANGE EACH TIME: ...] is your goal. Update it each time before you send the prompt.</p>' +
      '<textarea id="promptBox" rows="9" aria-labelledby="promptTitle" aria-describedby="promptHint" spellcheck="true"></textarea>' +
      '<div class="btn-row"><button type="button" class="btn primary" id="copyPrompt">Copy prompt</button>' +
      '<button type="button" class="btn secondary" id="downloadPrompt">Download as a text file</button></div>' +
      '<p class="status" id="promptStatus" role="status"></p>' +
      '<p class="keep"><strong>Where to keep it:</strong> Save it somewhere you can find fast, such as a pinned note on your phone, a file on your desktop, or a project in your chatbot app.</p>' +
      '<p>Want to test it? Paste the prompt into any chatbot.</p></section>' +

      '<section class="edit-section" aria-labelledby="editTitle"><h2 id="editTitle">Change an answer</h2>' +
      '<p class="hint" id="editNote"' + (state.promptEdited !== null ? '' : ' hidden') + '>Changing an answer rebuilds the prompt from your answers. Any typing you did in the prompt box will be replaced.</p>' +
      '<ul class="edit-links">' + edits + '</ul></section>' +

      '<section aria-labelledby="doneTitle"><h2 id="doneTitle">Done checklist</h2><ul class="checklist">' + checklist + '</ul></section>' +

      '<section class="another-section" aria-labelledby="anotherTitle"><h2 id="anotherTitle">Make another one</h2>' +
      '<p>Have another task that keeps getting stuck? Start a new cue and prompt from Step 1.</p>' +
      '<button type="button" class="btn secondary" id="anotherBtn">Make another one</button></section>' +

      '<div class="nav"><button type="button" class="btn secondary" id="backBtn">Back</button></div></div>';
  }

  var statusTimers = {};
  function flash(id, msg) {
    var el = $('#' + id);
    if (!el) return;
    el.textContent = msg;
    clearTimeout(statusTimers[id]);
    statusTimers[id] = setTimeout(function () { el.textContent = ''; }, 6000);
  }

  function copyText(text, statusId, okMsg) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      flash(statusId, ok ? okMsg : "Your browser didn't allow copying. Select the text and copy it yourself.");
    }
    var active = document.activeElement;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { flash(statusId, okMsg); }, function () { fallback(); if (active) active.focus(); });
    } else { fallback(); if (active) active.focus(); }
  }

  function fullText() {
    return 'My cue sentence\n' + cueSentence('text') + '\n\nMy saved prompt\n' + promptText() + '\n';
  }

  function bindResult() {
    var box = $('#promptBox');
    box.value = promptText();
    box.addEventListener('input', function () {
      state.promptEdited = box.value;
      $('#editNote').hidden = false;
      save();
    });
    $('#copyCue').addEventListener('click', function () { copyText(cueSentence('text'), 'cueStatus', 'Copied.'); });
    $('#copyPrompt').addEventListener('click', function () { copyText(box.value, 'promptStatus', 'Copied.'); });
    $('#downloadPrompt').addEventListener('click', function () {
      var text = 'My cue sentence\n' + cueSentence('text') + '\n\nMy saved prompt\n' + box.value + '\n';
      var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'my-cue-and-prompt.txt';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      flash('promptStatus', 'Downloaded as my-cue-and-prompt.txt.');
    });
    $('#printCue').addEventListener('click', printCard);
    $$('[data-edit]').forEach(function (b) {
      b.addEventListener('click', function () {
        state.editing = true;
        go(Number(b.getAttribute('data-edit')));
      });
    });
    $('#anotherBtn').addEventListener('click', function (e) { openRestart(e.currentTarget); });
    $('#backBtn').addEventListener('click', function () { go(5); });
  }

  function printCard() {
    var area = $('#printArea');
    area.innerHTML = '<div class="card"><div class="card-label">My cue</div>' + esc(cueSentence('text')) + '</div>';
    document.body.classList.add('print-card');
    var done = function () { document.body.classList.remove('print-card'); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    window.print();
    setTimeout(done, 1000);
  }

  /* ---------- Dialogs ---------- */

  var returnFocus = null;
  var skipReturnFocus = false;

  function openDialog(dlg, opener) {
    returnFocus = opener || document.activeElement;
    skipReturnFocus = false;
    dlg.showModal();
  }
  function onDialogClose() {
    if (!skipReturnFocus && returnFocus && document.body.contains(returnFocus)) returnFocus.focus();
    returnFocus = null;
  }
  ['#breakDialog', '#restartDialog'].forEach(function (id) { $(id).addEventListener('close', onDialogClose); });

  function openBreak(opener) {
    var body = $('#breakBody'), actions = $('#breakActions');
    $('#breakStatus').textContent = '';
    if (storageOK) {
      body.innerHTML = '<p>Your answers are saved in this browser. When you come back to this page, you\'ll pick up at Step ' + state.step + '. You can close this tab now.</p>' +
        '<p><strong>Shared or public computer?</strong> Choose Start over before you leave to clear your answers.</p>';
      actions.innerHTML = '<button type="button" class="btn primary" id="backToActivity" autofocus>Back to the activity</button>';
    } else {
      body.innerHTML = '<p>This browser can\'t save your answers, so they\'ll be lost if you close this tab. Leave the tab open, or copy what you have so far.</p>';
      actions.innerHTML = '<button type="button" class="btn primary" id="copyWhatIHave">Copy what I have</button>' +
        '<button type="button" class="btn secondary" id="backToActivity" autofocus>Back to the activity</button>';
      $('#copyWhatIHave').addEventListener('click', function () { copyText(fullText(), 'breakStatus', 'Copied.'); });
    }
    $('#backToActivity').addEventListener('click', function () { $('#breakDialog').close(); });
    openDialog($('#breakDialog'), opener);
    $('#backToActivity').focus();
  }

  function openRestart(opener) {
    $('#restartExtra').hidden = state.step !== TOTAL || onIntro;
    openDialog($('#restartDialog'), opener);
    $('#keepBtn').focus();
  }

  $('#breakBtn').addEventListener('click', function (e) { openBreak(e.currentTarget); });
  $('#restartBtn').addEventListener('click', function (e) { openRestart(e.currentTarget); });
  $('#keepBtn').addEventListener('click', function () { $('#restartDialog').close(); });
  $('#clearBtn').addEventListener('click', function () {
    skipReturnFocus = true;
    $('#restartDialog').close();
    clearSaved();
    state = freshState();
    go(1);
    announce('Your answers are cleared. Step 1 of 6.');
  });

  /* ---------- Start ---------- */

  var saved = load();
  if (saved) {
    state = saved;
    state.editing = false;
    welcomeBack = hasAnswers(saved);
  }
  onIntro = true;
  render();
})();
</script>
</body>
</html>
